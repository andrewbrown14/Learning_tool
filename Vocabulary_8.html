<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Tool</title>
    <style>
        :root {
            --primary: #4257b2;
            --primary-hover: #3b4ca0;
            --bg: #f6f7fb;
            --card-bg: #ffffff;
            --text: #303545;
            --correct: #23b26d;
            --correct-bg: #eafcf1;
            --incorrect: #ff725e;
            --incorrect-bg: #ffebe9;
            --border: #e0e0e0;
            --accent-orange: #e67e22;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            border: 3px solid #dcdde1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 6px;
            color: var(--primary);
            text-align: center;
            font-size: 28px;
        }

        .status-bar {
            text-align: center;
            font-size: 13px;
            color: var(--correct);
            font-weight: bold;
            margin-bottom: 18px;
        }

        .nav-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 3px solid #eef2f7;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 17px;
            font-weight: bold;
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
            color: #7f8c8d;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background-color: #eef2f7;
            color: var(--text);
        }

        .selector-box {
            margin-bottom: 25px;
            padding: 20px;
            background: #f0f2f9;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        select, input[type="number"] {
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid var(--border);
            outline: none;
            background: white;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .quiz-grid.bd-layout {
            grid-template-columns: 1fr;
        }

        @media (min-width: 650px) {
            .quiz-grid.bd-layout {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Instant CSS classes for hiding Pictures, Descriptions, or Both */
        .quiz-grid.hide-bd-pics .bd-image-box {
            display: none !important;
        }

        .quiz-grid.hide-bd-desc .bd-clue {
            display: none !important;
        }

        .quiz-card {
            background: #fafbfc;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.02);
        }

        .question-header {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .highlight-word {
            background-color: #ffeaa7;
            padding: 2px 10px;
            border-radius: 6px;
            color: #2d3436;
            font-weight: bold;
            border: 2px solid #fdcb6e;
            display: inline-block;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 500px) {
            .options-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn:hover {
            background-color: #f0f2f9;
            border-color: var(--primary);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #eaf0fa;
        }

        .option-btn.correct {
            border-color: var(--correct) !important;
            background-color: var(--correct-bg) !important;
            color: var(--correct) !important;
        }

        .option-btn.incorrect {
            border-color: var(--incorrect) !important;
            background-color: var(--incorrect-bg) !important;
            color: var(--incorrect) !important;
        }

        .correct-answer-reveal {
            font-size: 14px;
            color: var(--correct);
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        .bd-card {
            background: white;
            border: 3px dashed var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .bd-image-box {
            width: 130px;
            height: 130px;
            background: #f7fafc;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e2e8f0;
            font-size: 68px;
            line-height: 1;
            user-select: none;
        }

        .bd-clue {
            font-size: 14px;
            color: #475569;
            font-weight: bold;
            background: #f1f5f9;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .bd-word-display {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 4px 0;
        }

        .bd-blank {
            color: var(--accent-orange);
            border-bottom: 4px solid var(--accent-orange);
            display: inline-block;
            width: 32px;
            text-align: center;
        }

        .bd-choices {
            display: flex;
            gap: 25px;
        }

        .choice-letter-btn {
            font-size: 28px;
            font-weight: bold;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--border);
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .choice-letter-btn:hover {
            transform: scale(1.1);
        }

        .choice-letter-btn.selected-b {
            background-color: #ffe8d6 !important;
            border-color: var(--accent-orange) !important;
            color: var(--accent-orange) !important;
        }

        .choice-letter-btn.selected-d {
            background-color: #e0f2fe !important;
            border-color: var(--primary) !important;
            color: var(--primary) !important;
        }

        .choice-letter-btn.correct {
            border-color: var(--correct) !important;
            background-color: var(--correct-bg) !important;
            color: var(--correct) !important;
        }

        .choice-letter-btn.incorrect {
            border-color: var(--incorrect) !important;
            background-color: var(--incorrect-bg) !important;
            color: var(--incorrect) !important;
        }

        .footer-action {
            text-align: center;
            margin-top: 25px;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(66, 87, 178, 0.2);
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-panel {
            display: none;
            background-color: #f0f2f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        /* Glossary Specific Styling */
        .glossary-box {
            display: none;
        }

        .glossary-section {
            margin-bottom: 35px;
        }

        .glossary-section h3 {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            padding-bottom: 8px;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .glossary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 650px) {
            .glossary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .glossary-card {
            background: #fafbfc;
            border: 2px solid var(--border);
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            padding: 16px;
        }

        .glossary-term {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .glossary-def {
            font-size: 15px;
            line-height: 1.45;
            color: var(--text);
            margin-bottom: 8px;
        }

        .glossary-ex {
            font-size: 13px;
            background: #eef2f9;
            padding: 6px 10px;
            border-radius: 6px;
            color: #475569;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>&#127890;Learning Tool</h2>
    <div class="status-bar" id="status-bar">Loading question banks...</div>

    <div class="nav-tabs">
        <button type="button" class="tab-btn active" id="tab-grammar">Grammar</button>
        <button type="button" class="tab-btn" id="tab-math">Math</button>
        <button type="button" class="tab-btn" id="tab-bd">b vs d</button>
        <button type="button" class="tab-btn" id="tab-glossary">Glossary</button>
    </div>
    
    <!-- CONTROLS BOX -->
    <div class="selector-box" id="selector-box-container">
        <div class="control-row">
            <!-- Grammar / Math Category Filter -->
            <div class="control-group" id="filter-group">
                <label for="category-filter" style="font-weight: bold;">Set Mode:</label>
                <select id="category-filter">
                    <option value="all" selected>All Categories (Randomized)</option>
                    <option value="single">Single Category</option>
                    <option value="custom">Custom Checkboxes</option>
                </select>
            </div>

            <div class="control-group" id="single-cat-group" style="display: none;">
                <label for="single-cat-select" style="font-weight: bold;">Choose:</label>
                <select id="single-cat-select"></select>
            </div>

            <!-- b vs d Hint Toggle Controls (Visible on b vs d Tab) -->
            <div class="control-group" id="bd-hint-group" style="display: none;">
                <label for="bd-hint-mode" style="font-weight: bold;">Hint Display:</label>
                <select id="bd-hint-mode">
                    <option value="both" selected>Show Both (Pictures &amp; Descriptions)</option>
                    <option value="no-pics">Remove Pictures (Descriptions Only)</option>
                    <option value="no-desc">Remove Descriptions (Pictures Only)</option>
                    <option value="none">Remove Both (Word Blank Only)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="quest-length" style="font-weight: bold;">Questions:</label>
                <input type="number" id="quest-length" value="10" min="2" max="100" style="width: 75px;">
            </div>

            <button type="button" class="action-btn" id="reset-btn" style="padding: 8px 15px; font-size: 14px;">New Set &#128260;</button>
        </div>

        <div id="custom-checkboxes-container" style="display: none;">
            <p style="margin: 0 0 10px 0; font-weight: bold; font-size: 14px;">Select categories to include in random quiz:</p>
            <div class="checkbox-group" id="checkbox-list"></div>
        </div>
    </div>

    <!-- MAIN WORKSHEET GRID -->
    <div class="quiz-grid" id="worksheet-grid"></div>

    <!-- FINISH AND GRADE BUTTON -->
    <div class="footer-action" id="footer-action-container">
        <button type="button" class="action-btn" id="grade-btn">Finish and Grade</button>
    </div>

    <!-- QUIZ RESULTS PANEL -->
    <div class="results-panel" id="results-panel">
        <h3>&#127881; Test Results</h3>
        <div class="score-display" id="score-percent">0%</div>
        <p id="score-details" style="font-size: 18px; font-weight: bold;"></p>
        <button type="button" class="action-btn" id="restart-btn">Start New Test</button>
    </div>

    <!-- STUDY GLOSSARY SECTION -->
    <div class="glossary-box" id="glossary-box-container">
        <div class="glossary-section">
            <h3>Grammar Term Glossary</h3>
            <div class="glossary-grid" id="grammar-glossary-grid"></div>
        </div>

        <div class="glossary-section">
            <h3>Math Term Glossary</h3>
            <div class="glossary-grid" id="math-glossary-grid"></div>
        </div>
    </div>
</div>

<script>
(function() {
    var activeMode = 'grammar';
    var activeQuestions = [];
    var isGraded = false;
    var userSelections = {};

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = a[i];
            a[i] = a[j];
            a[j] = temp;
        }
        return a;
    }

    // =========================================================================
    // GLOSSARY REFERENCE DATA
    // =========================================================================
    var grammarGlossaryTerms = [
        { term: "Noun", def: "A word that names a person, place, thing, or idea.", ex: "Examples: dog, teacher, park, pencil, kindness" },
        { term: "Proper Noun", def: "The specific name of a particular person, place, holiday, or month. It always begins with a capital letter.", ex: "Examples: Mary, Chicago, Tuesday, July, Disney" },
        { term: "Pronoun", def: "A word that takes the place of a noun so we do not have to repeat the noun over and over.", ex: "Examples: he, she, they, it, we, her, him, us" },
        { term: "Adjective", def: "A describing word that tells us more about a noun (such as its color, size, shape, or how many).", ex: "Examples: red, fluffy, tall, sweet, shiny, three" },
        { term: "Verb", def: "A word that shows an action (what someone or something is doing) or a state of being.", ex: "Examples: jumped, ran, swim, read, is, were" },
        { term: "Adverb", def: "A word that describes a verb, an adjective, or another adverb. It tells how, when, or where an action happens, and often ends in -ly.", ex: "Examples: quickly, softly, carefully, loudly, yesterday" },
        { term: "Preposition", def: "A word that shows location, direction, or time relationship between a noun and other words in a sentence.", ex: "Examples: under, over, inside, behind, between, through" },
        { term: "Conjunction", def: "A joining word that connects words, phrases, or clauses together into a longer sentence.", ex: "Examples: and, but, or, because, although, so" },
        { term: "Interjection", def: "An exclamation word or phrase that expresses sudden, strong feeling or emotion.", ex: "Examples: Wow!, Ouch!, Yay!, Oops!, Hooray!" }
    ];

    var mathGlossaryTerms = [
        { term: "Whole Number", def: "A counting number with no fractions or decimals (0, 1, 2, 3, 4, and so on).", ex: "Examples: 0, 7, 25, 100" },
        { term: "Even Number", def: "Any whole number that can be divided into 2 equal groups with nothing left over. Always ends in 0, 2, 4, 6, or 8.", ex: "Examples: 2, 14, 26, 58, 90" },
        { term: "Odd Number", def: "Any whole number that cannot be divided evenly by 2 (always leaves 1 left over). Always ends in 1, 3, 5, 7, or 9.", ex: "Examples: 3, 15, 27, 49, 81" },
        { term: "Prime Number", def: "A whole number greater than 1 that has ONLY two factors: 1 and itself.", ex: "Examples: 2, 3, 5, 7, 11, 13, 17, 19" },
        { term: "Composite Number", def: "A whole number greater than 1 that has MORE than two factors (it can be divided evenly by numbers other than 1 and itself).", ex: "Examples: 4, 6, 8, 9, 10, 12, 15" },
        { term: "Factor", def: "A whole number that is multiplied by another number to get a product, or divides evenly into a larger number.", ex: "Example: In 3 x 4 = 12, the numbers 3 and 4 are factors of 12." },
        { term: "Equation", def: "A mathematical sentence that uses an equal sign (=) to show that two sides have the exact same value.", ex: "Examples: 4 + 5 = 9, or 3 + x = 10" },
        { term: "Addition & Sum", def: "Addition is combining two or more numbers together. The total answer you get is called the Sum.", ex: "Example: In 6 + 4 = 10, 10 is the sum." },
        { term: "Subtraction & Difference", def: "Subtraction is taking one number away from another. The answer you get is called the Difference.", ex: "Example: In 15 - 6 = 9, 9 is the difference." },
        { term: "Multiplication & Product", def: "Multiplication is repeated addition of equal groups. The answer to a multiplication problem is called the Product.", ex: "Example: In 5 x 4 = 20, 20 is the product." },
        { term: "Division & Quotient", def: "Division is splitting a total into equal groups or shares. The answer to a division problem is called the Quotient.", ex: "Example: In 20 / 5 = 4, 4 is the quotient." },
        { term: "Remainder", def: "The amount left over when a number cannot be divided evenly into equal whole groups.", ex: "Example: 13 divided by 4 is 3 with a remainder of 1." }
    ];

    function renderGlossary() {
        var gGrid = document.getElementById('grammar-glossary-grid');
        var mGrid = document.getElementById('math-glossary-grid');
        gGrid.innerHTML = '';
        mGrid.innerHTML = '';

        for (var i = 0; i < grammarGlossaryTerms.length; i++) {
            var g = grammarGlossaryTerms[i];
            var card = document.createElement('div');
            card.className = 'glossary-card';
            card.innerHTML =
                '<div class="glossary-term">' + g.term + '</div>' +
                '<div class="glossary-def">' + g.def + '</div>' +
                '<div class="glossary-ex">' + g.ex + '</div>';
            gGrid.appendChild(card);
        }

        for (var j = 0; j < mathGlossaryTerms.length; j++) {
            var m = mathGlossaryTerms[j];
            var mCard = document.createElement('div');
            mCard.className = 'glossary-card';
            mCard.innerHTML =
                '<div class="glossary-term">' + m.term + '</div>' +
                '<div class="glossary-def">' + m.def + '</div>' +
                '<div class="glossary-ex">' + m.ex + '</div>';
            mGrid.appendChild(mCard);
        }
    }

    // =========================================================================
    // 1. GRAMMAR DATABASE (250+ Questions)
    // =========================================================================
    var nounsList = ["dog", "cat", "apple", "pencil", "desk", "house", "teacher", "student", "car", "park", "tree", "river", "mountain", "bird", "laptop", "phone", "backpack", "clock", "flower", "jacket", "bicycle", "island", "window", "garden", "sandwich"];
    var verbsList = ["ran", "swam", "jumped", "read", "wrote", "slept", "sang", "danced", "laughed", "walked", "painted", "cooked", "built", "cleaned", "smiled", "shouted", "climbed", "flew", "drove", "bought", "listened", "whispered", "studied", "carried", "threw"];
    var adjectivesList = ["red", "soft", "fluffy", "bright", "cold", "hot", "shiny", "tiny", "huge", "heavy", "sweet", "loud", "quiet", "clean", "brave", "smart", "lazy", "funny", "scary", "beautiful", "tall", "wooden", "angry", "gentle", "round"];
    var adverbsList = ["quickly", "slowly", "happily", "sadly", "loudly", "quietly", "gently", "carefully", "neatly", "wildly", "gracefully", "politely", "rudely", "boldly", "easily", "brightly", "calmly", "eagerly", "silently", "proudly", "bravely", "fiercely", "warmly", "lazily", "tightly"];
    var prepositionsList = ["under", "over", "on", "in", "behind", "beside", "inside", "outside", "through", "across", "between", "against", "toward", "above", "below", "around", "near", "during", "without", "into"];
    var pronounsList = ["he", "she", "they", "it", "we", "I", "you", "him", "her", "us", "them", "myself", "herself", "himself", "ourselves"];
    var properNounsList = ["Mary", "London", "Paris", "New York", "Chicago", "Disney", "Microsoft", "Dr. Smith", "Saturday", "July", "Christmas", "Tuesday", "Jupiter", "Canada", "Friday", "October", "Sarah", "Texas", "Amazon", "Monday"];
    var conjunctionsList = ["and", "but", "or", "because", "so", "although", "since", "until", "unless", "while", "yet", "whenever", "whereas"];
    var interjectionsList = ["Wow!", "Ouch!", "Oops!", "Yay!", "Hey!", "Oh!", "Alas!", "Hurrah!", "Aha!", "Gosh!", "Bravo!", "Yikes!", "Phew!", "Hooray!"];

    var grammarDatabase = [];

    var grammarDefsBank = [
        { q: "What part of speech is a word that names a person, place, thing, or idea?", ans: "Noun", opts: ["Noun", "Verb", "Adjective", "Pronoun"] },
        { q: "Which part of speech names a general person, place, or thing (like boy, city, or dog)?", ans: "Noun", opts: ["Noun", "Proper Noun", "Adverb", "Preposition"] },
        { q: "A word that names an object you can touch, see, or talk about is called a ________.", ans: "Noun", opts: ["Noun", "Verb", "Conjunction", "Interjection"] },
        { q: "If a word tells you WHO or WHAT a sentence is about (like teacher, park, or apple), it is a ________.", ans: "Noun", opts: ["Noun", "Adjective", "Verb", "Adverb"] },

        { q: "What part of speech takes the place of a noun so we do not have to repeat the noun over and over?", ans: "Pronoun", opts: ["Pronoun", "Noun", "Proper Noun", "Adjective"] },
        { q: "Words like he, she, it, they, and we are examples of what part of speech?", ans: "Pronoun", opts: ["Pronoun", "Preposition", "Conjunction", "Verb"] },
        { q: "Instead of saying 'Sarah went to Sarah's house', we use a word like 'her'. What part of speech is 'her'?", ans: "Pronoun", opts: ["Pronoun", "Proper Noun", "Adverb", "Interjection"] },
        { q: "A short word that substitutes for a specific person or thing (such as him, them, or us) is a ________.", ans: "Pronoun", opts: ["Pronoun", "Adjective", "Noun", "Verb"] },

        { w: "dish", icon: "&#129379;", clue: "A bowl or plate used to serve food" },

        { w: "doctor", icon: "&#129658;", clue: "Uses a stethoscope to help sick people get well" },

        { w: "dollar", icon: "&#128181;", clue: "Paper money worth one hundred cents" },
        { w: "domino", icon: "&#127073;", clue: "A rectangular tile with dots that you line up and topple" },
        { w: "donkey", icon: "&#129743;", clue: "A stubborn farm animal with long ears related to a horse" },
        { w: "donut", icon: "&#127849;", clue: "A sweet fried ring of dough with frosting and sprinkles" },
        { w: "door", icon: "&#128682;", clue: "Has a handle and hinges to enter a room" },
        { w: "dove", icon: "&#128330;", clue: "A peaceful white bird carrying an olive branch" },

        { w: "dragon", icon: "&#128009;", clue: "A mythical flying creature that breathes fire" },
        { w: "draw", icon: "&#9999;", clue: "To sketch a picture using a pencil or crayons" },
        { w: "dream", icon: "&#128173;", clue: "Stories and pictures your mind imagines while sleeping" },
        { w: "dress", icon: "&#128087;", clue: "A one-piece outfit with a skirt" },
        { w: "drill", icon: "&#129691;", clue: "A tool that spins to make holes or drive screws" },
        { w: "drink", icon: "&#129380;", clue: "Sipping juice or water through a straw" },
        { w: "drive", icon: "&#128663;", clue: "Steering a car down the highway" },
        { w: "drop", icon: "&#128167;", clue: "A single bead of water falling from a faucet" },
        { w: "drum", icon: "&#129345;", clue: "A musical instrument you beat with sticks" },
        { w: "dumbbell", icon: "&#127947;", clue: "A short bar with weights lifted for exercise" },
        { w: "dumpling", icon: "&#129375;", clue: "A folded pocket of dough filled with meat or veggies" },
        { w: "dusk", icon: "&#127750;", clue: "The twilight time in the evening just after sunset" },
        { w: "dustpan", icon: "&#128465;", clue: "Scoops up the dirt pile after you sweep" },
        { w: "duvet", icon: "&#128719;", clue: "A fluffy quilted comforter on a bed" },
        { w: "dynamite", icon: "&#129512;", clue: "A red blasting stick used to clear rock" },
        { w: "daffodil", icon: "&#128144;", clue: "A bright yellow trumpet-shaped spring flower" },
        { w: "dandelion", icon: "&#127793;", clue: "A yellow lawn weed that turns into a white puffball" },
        { w: "dashboard", icon: "&#127899;", clue: "The control panel with dials in front of a car driver" }
    ];

    var bdDatabase = [];
    for (var b = 0; b < bdItemsRaw.length; b++) {
        var bItem = bdItemsRaw[b];
        bdDatabase.push({
            category: "b vs d",
            word: "_" + bItem.w.slice(1),
            letter: bItem.w.charAt(0),
            correctWord: bItem.w,
            icon: bItem.icon,
            clue: bItem.clue
        });
    }

    function getDatabase() {
        if (activeMode === 'grammar') return grammarDatabase;
        if (activeMode === 'math') return mathDatabase;
        return bdDatabase;
    }

    function applyBDHintVisibility() {
        var grid = document.getElementById('worksheet-grid');
        var hintMode = document.getElementById('bd-hint-mode').value;

        grid.classList.remove('hide-bd-pics', 'hide-bd-desc');

        if (activeMode === 'bd') {
            if (hintMode === 'no-pics') {
                grid.classList.add('hide-bd-pics');
            } else if (hintMode === 'no-desc') {
                grid.classList.add('hide-bd-desc');
            } else if (hintMode === 'none') {
                grid.classList.add('hide-bd-pics', 'hide-bd-desc');
            }
        }
    }

    function switchMode(mode) {
        activeMode = mode;
        var tabs = document.querySelectorAll('.tab-btn');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove('active');
        }
        document.getElementById('tab-' + mode).classList.add('active');

        var selectorBox = document.getElementById('selector-box-container');
        var worksheetGrid = document.getElementById('worksheet-grid');
        var footerAction = document.getElementById('footer-action-container');
        var resultsPanel = document.getElementById('results-panel');
        var glossaryBox = document.getElementById('glossary-box-container');

        if (mode === 'glossary') {
            selectorBox.style.display = 'none';
            worksheetGrid.style.display = 'none';
            footerAction.style.display = 'none';
            resultsPanel.style.display = 'none';
            glossaryBox.style.display = 'block';
        } else {
            selectorBox.style.display = 'flex';
            worksheetGrid.style.display = 'grid';
            footerAction.style.display = 'block';
            glossaryBox.style.display = 'none';
            populateFilterControls();
        }
    }

    function populateFilterControls() {
        var db = getDatabase();
        var categories = [];
        for (var i = 0; i < db.length; i++) {
            if (categories.indexOf(db[i].category) === -1) {
                categories.push(db[i].category);
            }
        }

        var filterGroup = document.getElementById('filter-group');
        var bdHintGroup = document.getElementById('bd-hint-group');

        if (activeMode === 'bd') {
            document.getElementById('category-filter').value = 'all';
            filterGroup.style.display = 'none';
            bdHintGroup.style.display = 'flex';
        } else {
            filterGroup.style.display = 'flex';
            bdHintGroup.style.display = 'none';
        }

        var singleSelect = document.getElementById('single-cat-select');
        singleSelect.innerHTML = '';
        for (var j = 0; j < categories.length; j++) {
            var opt = document.createElement('option');
            opt.value = categories[j];
            opt.textContent = categories[j];
            singleSelect.appendChild(opt);
        }

        var listContainer = document.getElementById('checkbox-list');
        listContainer.innerHTML = '';
        for (var k = 0; k < categories.length; k++) {
            var label = document.createElement('label');
            label.className = 'checkbox-label';
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'cat-checkbox';
            cb.value = categories[k];
            cb.checked = true;
            cb.addEventListener('change', initWorksheet);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + categories[k]));
            listContainer.appendChild(label);
        }

        handleFilterChange();
    }

    function handleFilterChange() {
        var filterVal = document.getElementById('category-filter').value;
        var singleGroup = document.getElementById('single-cat-group');
        var customContainer = document.getElementById('custom-checkboxes-container');

        if (activeMode === 'bd') {
            singleGroup.style.display = 'none';
            customContainer.style.display = 'none';
        } else if (filterVal === 'single') {
            singleGroup.style.display = 'flex';
            customContainer.style.display = 'none';
        } else if (filterVal === 'custom') {
            singleGroup.style.display = 'none';
            customContainer.style.display = 'block';
        } else {
            singleGroup.style.display = 'none';
            customContainer.style.display = 'none';
        }

        initWorksheet();
    }

    function initWorksheet() {
        isGraded = false;
        userSelections = {};
        document.getElementById('results-panel').style.display = 'none';
        document.getElementById('grade-btn').style.display = 'inline-block';

        var db = getDatabase();
        var filterVal = document.getElementById('category-filter').value;
        var targetLen = parseInt(document.getElementById('quest-length').value, 10) || 10;

        var filteredPool = [];

        if (activeMode === 'bd' || filterVal === 'all') {
            filteredPool = db.slice();
        } else if (filterVal === 'single') {
            var selectedCat = document.getElementById('single-cat-select').value;
            for (var i = 0; i < db.length; i++) {
                if (db[i].category === selectedCat) {
                    filteredPool.push(db[i]);
                }
            }
        } else if (filterVal === 'custom') {
            var cbs = document.querySelectorAll('.cat-checkbox:checked');
            var checkedValues = [];
            for (var c = 0; c < cbs.length; c++) {
                checkedValues.push(cbs[c].value);
            }
            for (var j = 0; j < db.length; j++) {
                if (checkedValues.indexOf(db[j].category) !== -1) {
                    filteredPool.push(db[j]);
                }
            }
        }

        var shuffled = shuffle(filteredPool);
        var seen = {};
        var uniquePool = [];
        for (var u = 0; u < shuffled.length; u++) {
            var key = shuffled[u].q || shuffled[u].correctWord;
            if (!seen[key]) {
                seen[key] = true;
                uniquePool.push(shuffled[u]);
            }
        }

        activeQuestions = uniquePool.slice(0, targetLen);
        renderWorksheet();
    }

    function renderWorksheet() {
        var grid = document.getElementById('worksheet-grid');
        grid.innerHTML = '';

        if (activeMode === 'bd') {
            grid.classList.add('bd-layout');
        } else {
            grid.classList.remove('bd-layout');
        }

        applyBDHintVisibility();

        if (activeQuestions.length === 0) {
            grid.innerHTML = '<p style="text-align:center; font-weight:bold; color:var(--incorrect);">Please select at least one category to generate questions!</p>';
            return;
        }

        for (var idx = 0; idx < activeQuestions.length; idx++) {
            (function(index) {
                var q = activeQuestions[index];
                if (activeMode === 'bd') {
                    var card = document.createElement('div');
                    card.className = 'bd-card';
                    card.id = 'card-' + index;
                    card.innerHTML =
                        '<div class="question-header">Question #' + (index + 1) + '</div>' +
                        '<div class="bd-image-box">' + q.icon + '</div>' +
                        '<div class="bd-clue">' + q.clue + '</div>' +
                        '<div class="bd-word-display"><span class="bd-blank" id="bd-blank-' + index + '">?</span>' + q.word.substring(1) + '</div>' +
                        '<div class="bd-choices"></div>' +
                        '<div class="correct-answer-reveal" id="reveal-' + index + '">Correct Word: ' + q.correctWord + '</div>';
                    
                    var choicesBox = card.querySelector('.bd-choices');
                    var btnB = document.createElement('button');
                    btnB.type = 'button';
                    btnB.className = 'choice-letter-btn';
                    btnB.setAttribute('data-letter', 'b');
                    btnB.textContent = 'b';
                    btnB.addEventListener('click', function() { selectBD(index, 'b'); });

                    var btnD = document.createElement('button');
                    btnD.type = 'button';
                    btnD.className = 'choice-letter-btn';
                    btnD.setAttribute('data-letter', 'd');
                    btnD.textContent = 'd';
                    btnD.addEventListener('click', function() { selectBD(index, 'd'); });

                    choicesBox.appendChild(btnB);
                    choicesBox.appendChild(btnD);
                    grid.appendChild(card);
                } else {
                    var qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.id = 'card-' + index;
                    qCard.innerHTML =
                        '<div class="question-header">Question #' + (index + 1) + '</div>' +
                        '<div class="question-text">' + q.q + '</div>' +
                        '<div class="options-container"></div>' +
                        '<div class="correct-answer-reveal" id="reveal-' + index + '">Correct Answer: ' + q.ans + '</div>';

                    var optsContainer = qCard.querySelector('.options-container');
                    for (var o = 0; o < q.options.length; o++) {
                        (function(optVal) {
                            var btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'option-btn';
                            btn.textContent = optVal;
                            btn.addEventListener('click', function() { selectOption(index, optVal, btn); });
                            optsContainer.appendChild(btn);
                        })(q.options[o]);
                    }
                    grid.appendChild(qCard);
                }
            })(idx);
        }
    }

    function selectOption(idx, val, btn) {
        if (isGraded) return;
        userSelections[idx] = val;

        var siblings = btn.parentNode.querySelectorAll('.option-btn');
        for (var i = 0; i < siblings.length; i++) {
            siblings[i].classList.remove('selected');
        }
        btn.classList.add('selected');
    }

    function selectBD(idx, letter) {
        if (isGraded) return;
        userSelections[idx] = letter;

        var blank = document.getElementById('bd-blank-' + idx);
        blank.textContent = letter;
        blank.style.color = (letter === 'b') ? 'var(--accent-orange)' : 'var(--primary)';

        var card = document.getElementById('card-' + idx);
        var btns = card.querySelectorAll('.choice-letter-btn');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.remove('selected-b', 'selected-d');
            if (btns[i].getAttribute('data-letter') === letter) {
                btns[i].classList.add(letter === 'b' ? 'selected-b' : 'selected-d');
            }
        }
    }

    function gradeTest() {
        if (isGraded || activeQuestions.length === 0) return;
        isGraded = true;

        var correctCount = 0;
        var total = activeQuestions.length;

        for (var idx = 0; idx < total; idx++) {
            var q = activeQuestions[idx];
            var card = document.getElementById('card-' + idx);
            var reveal = document.getElementById('reveal-' + idx);
            var chosen = userSelections[idx];
            reveal.style.display = 'block';

            if (activeMode === 'bd') {
                if (chosen === q.letter) correctCount++;
                var bdBtns = card.querySelectorAll('.choice-letter-btn');
                for (var b = 0; b < bdBtns.length; b++) {
                    bdBtns[b].disabled = true;
                    var btnLetter = bdBtns[b].getAttribute('data-letter');
                    if (btnLetter === q.letter) {
                        bdBtns[b].classList.add('correct');
                    } else if (btnLetter === chosen) {
                        bdBtns[b].classList.add('incorrect');
                    }
                }
            } else {
                if (chosen === q.ans) correctCount++;
                var optBtns = card.querySelectorAll('.option-btn');
                for (var o = 0; o < optBtns.length; o++) {
                    optBtns[o].disabled = true;
                    if (optBtns[o].textContent === q.ans) {
                        optBtns[o].classList.add('correct');
                    } else if (optBtns[o].textContent === chosen) {
                        optBtns[o].classList.add('incorrect');
                    }
                }
            }
        }

        document.getElementById('grade-btn').style.display = 'none';
        document.getElementById('results-panel').style.display = 'block';

        var finalPercentage = Math.round((correctCount / total) * 100);
        document.getElementById('score-percent').textContent = finalPercentage + '%';
        document.getElementById('score-details').textContent = 'Correct: ' + correctCount + ' / ' + total + ' Problems';

        setTimeout(function() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 100);
    }

    // Bind all UI controls via standard Event Listeners
    document.getElementById('tab-grammar').addEventListener('click', function() { switchMode('grammar'); });
    document.getElementById('tab-math').addEventListener('click', function() { switchMode('math'); });
    document.getElementById('tab-bd').addEventListener('click', function() { switchMode('bd'); });
    document.getElementById('tab-glossary').addEventListener('click', function() { switchMode('glossary'); });
    document.getElementById('category-filter').addEventListener('change', handleFilterChange);
    document.getElementById('single-cat-select').addEventListener('change', initWorksheet);
    document.getElementById('bd-hint-mode').addEventListener('change', applyBDHintVisibility);
    document.getElementById('quest-length').addEventListener('change', initWorksheet);
    document.getElementById('reset-btn').addEventListener('click', initWorksheet);
    document.getElementById('grade-btn').addEventListener('click', gradeTest);
    document.getElementById('restart-btn').addEventListener('click', initWorksheet);

    // Initialize Glossary and First Tab
    renderGlossary();
    document.getElementById('status-bar').innerHTML = '&#9989; Ready! (' + grammarDatabase.length + ' Grammar, ' + mathDatabase.length + ' Math, ' + bdDatabase.length + ' b vs d Cards, and 21 Glossary Terms Loaded)';
    switchMode('grammar');
})();
</script>
